name: Diag 5619
on:
  push:
    branches: [diag-5619-macos]
permissions: read-all
jobs:
  diag:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '4.0']
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run the new #5627 concurrency tests 5 times
        run: |
          for i in 1 2 3 4 5; do
            bundle exec ruby -w -Ilib -Itest test/plugin/test_out_forward.rb -t "/late ack failure|concurrent rebuilds|a failed ack|never sends the ack/"
          done
      - name: Run all out_forward tests
        run: |
          bundle exec ruby -w -Ilib -Itest -e 'ARGV.each { |f| require File.expand_path(f) }' test/plugin/test_out_forward.rb test/plugin/out_forward/*.rb
